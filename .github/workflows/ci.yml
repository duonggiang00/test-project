name: Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  UV_VERSION: "0.11.16"
  SECRET_KEY: ci-only-placeholder-not-for-production
  BACKEND_CORS_ORIGINS: http://localhost:3000
  BACKEND_API_URL: http://127.0.0.1:8000
  HUSKY: "0"

jobs:
  fast:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create ignored fast-test environment file
        run: node scripts/create-ci-env.mjs fast

      - name: Run fast gate
        run: node scripts/verify.mjs fast

      - name: Upload fast-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fast-gate-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/reports/
            frontend/reports/
            frontend/.next/diagnostics/

  integration:
    name: PostgreSQL integration
    if: github.event_name == 'push'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_exam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Create ignored PostgreSQL test environment file
        run: node scripts/create-ci-env.mjs postgres

      - name: Run coverage and PostgreSQL integration gate
        env:
          COVERAGE_BASE_SHA: ${{ github.event.before }}
        run: node scripts/verify.mjs coverage

      - name: Run Alembic round trip
        run: node scripts/verify.mjs migration

      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/reports/
            frontend/reports/

  coverage-pr:
    name: Coverage regression
    if: github.event_name == 'pull_request'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_exam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create ignored PostgreSQL test environment file
        run: node scripts/create-ci-env.mjs postgres

      - name: Run coverage regression gate
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify.mjs coverage

      - name: Upload coverage diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/reports/
            frontend/reports/

  mocked-e2e:
    name: Mocked browser matrix
    if: github.event_name == 'pull_request'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run mocked critical-flow matrix
        run: node scripts/verify.mjs e2e-mocked

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mocked-browser-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: frontend/reports/playwright/

  real-e2e:
    name: Real backend smoke E2E
    if: github.event_name == 'push'
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_exam
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Create ignored PostgreSQL test environment file
        run: node scripts/create-ci-env.mjs postgres

      - name: Run real backend smoke flow
        run: node scripts/verify.mjs e2e-real

      - name: Upload real E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-e2e-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/reports/
            frontend/reports/playwright/
