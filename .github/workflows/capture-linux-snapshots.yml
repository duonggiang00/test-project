name: Temporary Linux Snapshot Capture

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  SECRET_KEY: ci-only-placeholder-not-for-production
  BACKEND_CORS_ORIGINS: http://localhost:3000
  BACKEND_API_URL: http://127.0.0.1:8000
  HUSKY: "0"

jobs:
  capture:
    name: Capture Linux snapshots (temporary)
    if: github.head_ref == 'ci/github-hosted-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build mocked production application
        run: node scripts/build-e2e-mocked.mjs

      - name: Capture Linux visual baselines
        working-directory: frontend
        run: npx playwright test --config=playwright.mocked.config.ts --update-snapshots

      - name: Upload captured Linux baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-baselines-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: frontend/tests/e2e/admin-flow.spec.ts-snapshots/*-linux.png
